name: soro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^27.2.2
  google_generative_ai: ^0.4.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#FFF9ED"
  image: assets/images/splash-icon.png
  branding: assets/images/splash-branding.png   # image shown at bottom
  branding_mode: bottom
  android_12:
    color: "#FFF9ED"
    image: assets/images/splash-icon.png
    branding: assets/images/splash-branding.png
    branding_mode: bottom

# App icon config (top-level, not inside dev_dependencies)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"

flutter:
  assets:
    - assets/images/soro-mascot.png
    - assets/images/soro-mascot-head.png
    - assets/images/soro-mascot-navbar.png
    - assets/images/home-page-bg.png

  uses-material-design: true

  fonts:
    - family: Baloo
      fonts:
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400

    - family: TheFoxTail
      fonts:
        - asset: assets/fonts/The-Fox-Tail.ttf